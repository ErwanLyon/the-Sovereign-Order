<script>
const scenes=[{"title": "Le Discours de Fondation", "place": "Monde des Hommes – Capitole Fédéral – Salle du Sénat Spécial", "time": "Fin d’après-midi", "paragraphs": ["Émission en direct sur toutes les grandes chaînes. Présence diplomatique internationale. Le peuple regarde.", "Les projecteurs éclairaient faiblement la tribune centrale du Sénat. L’ambiance était tendue, suspendue, comme avant une tempête.", "Des visages fermés, d’autres excités, quelques-uns (très peu) inquiets.", "Une silhouette se leva.", "Lui.", "L’homme qu’on ne présentait plus.", "Le Sovereign. Pas un nom de naissance. Un titre. Une promesse. Un avertissement.", "Il monta lentement les marches du pupitre, sans se presser.", "Pas de costume trop ajusté, pas de couleurs criardes. Un simple complet noir. Un regard droit. Et un silence qui parlait plus fort que les applaudissements qui l’accueillirent.", "Il observa longuement la salle, puis leva les mains.", "Le silence revint.", "Sa voix, lorsqu’elle s’éleva, était douce. Grave. Maîtrisée. Presque paternelle.", "– « Mes amis. Mes collègues. Mon peuple.", "Il avec cieux fut les nous où regardions temps un émerveillement. Où voir un être capable de voler était une bénédiction. Où entendre une voix parler au nom de la paix suffisait à faire taire les canons. »", "Il marque une pause. Ses yeux se posent sur l’écran géant derrière lui.", "Un enregistrement s’enclenche.", "Des amazones, en tenue de combat, puissantes, majestueuses, dévastent une colonne blindée dans un pays d’Amérique latine, pour protéger une enclave civile.", "Mais les images sont froides, montées sans contexte. Elles ne montrent que la violence. Le choc. La puissance inhumaine.", "Le ton de sa voix ne change pas.", "« Aujourd’hui… cette bénédiction est devenue un fardeau.", "Aujourd’hui, l’exception est devenue la règle.", "Et la règle… a cessé d’exister. »", "Il fait face à la salle.", "« Elles viennent d’un autre monde. Littéralement. Elles vivent à part, pensent à part. Elles ne se plient pas à nos lois. Elles s’en croient au-dessus.", "Elles ne sont pas élues. Elles ne sont pas soumises à un peuple.", "Et pourtant… elles prétendent incarner la justice. »", "Un murmure d’approbation naît. Il l’ignore.", "« C’est pourquoi, à compter de ce jour, j’annonce la création de l’AXE :", "L’Amazon Extradition Entity. Une force d’élite indépendante, dotée des pleins pouvoirs, chargée d’assurer l’intégrité de notre territoire… et de protéger nos lois de toute influence étrangère. Y compris divine. »", "Des éclats de voix, cette fois. Forts. Applaudissements. Debout. Une moitié du Sénat. Puis les gradins.", "Mais lui, toujours aussi calme, baisse légèrement la tête.", "« L’égalité commence par la loi.", "Même pour les immortelles. »", "Et il quitte la tribune. Sans sourire. Sans se retourner."]}, {"title": "Réunion à huis clos : la Vision", "place": "Complexe de l’Ordre – Bureau privé du Sovereign", "time": "Nuit", "paragraphs": ["Éclairage tamisé. Trois conseillers. Un plan. Une vision.", "Le bureau était vaste, mais sans ornement inutile.", "Pas de portraits. Pas de trophées. Seulement des cartes, des dossiers, des lignes de trajectoires politiques.", "Le Sovereign était debout, en manches retroussées, devant une carte de Themyscira projetée sur un mur.", "– « La force ne suffit pas, » dit-il sans se retourner.", "« Le pouvoir brut ne convainc personne. Il inquiète. Il divise. »", "Il se tourne lentement.", "« Mais la cohérence… la cohérence est irrésistible. »", "Ses trois conseillers l’écoutent, muets.", "« Il faut réécrire le mythe.", "Montrer que les amazones ne sont pas les championnes de la paix… mais de l’exception.", "De l’élitisme.", "De l’arbitraire. »", "Un des conseillers hoche lentement la tête.", "– « Les médias suivent. La peur monte. Le peuple vous suit. »", "– « Le peuple n’a jamais cessé de vouloir l’ordre, corrige doucement le Sovereign.", "Il faut juste lui donner une forme… à aimer. À servir. »", "Il effleure une image holographique de Wonder Woman, en pleine action, ailes déployées, lasso en main.", "« Et celle-ci, » dit-il en fixant l’image,", "« …sera l’outil de notre bascule.", "Notre emblème.", "L’erreur la plus visible… corrigée. »", "– « Vous pensez pouvoir l’utiliser ? »", "– « Je pense que sa culpabilité est une porte.", "Et que j’ai la clé. »"]}, {"title": "Premiers ordres de l’AXE", "place": "Extérieur – Base militaire noire", "time": "3h26 du matin", "paragraphs": ["3h26 du matin. Ciel couvert. Lune voilée. Silhouettes armées. Prêtes.", "Les membres de l’AXE ne portaient pas d’insigne traditionnel.", "Seulement un triangle noir, inversé, marqué du chiffre de leur unité.", "Ils s’alignaient en silence devant le hangar principal.", "Une femme, caporale au regard perçant, lisait un document holographique reçu quelques minutes plus tôt.", "– « Ordre exécutif numéro 001 : détention immédiate de toute Amazone identifiée sur territoire national.", "Objectif prioritaire : Diana de Themyscira. Statut spécial. Capture Correction létal. par recours sans transfert protocolaire.", "Protocole de réhabilitation activé. »", "Un silence de plomb.", "« C’est elle qu’ils veulent vivante. »", "Le hangar s’ouvre. Un véhicule blindé glisse dans l’obscurité.", "À l’intérieur, un module noir scellé : une capsule de rééducation psychique : technologie de pointe, conçue pour briser, réparer, et reformater.", "« Ils ne veulent pas l’éliminer…", "Ils veulent qu’elle serve. »", "La caporale inspire.", "« Démarrage de l’Opération Prométhée.", "Objectif : capturer une légende. Et l’oublier. »", "Et les moteurs grondent dans la nuit."]}, {"title": "La capture de Diana", "place": "Forêt de Ridgefield", "time": "4h17 du matin", "paragraphs": ["4h17 du matin. Brume. Vent. Présence détectée. Objectif confirmé.", "La lune s’était cachée. La forêt, endormie, bruissait à peine sous le vent humide de la nuit.", "Perchée dans les hauteurs, entre deux pins, Diana méditait. Elle n’était plus à Themyscira depuis des semaines. Elle vivait cachée. Chaque mission humanitaire, chaque déplacement, était un risque. Depuis la montée au pouvoir du Sovereign, elle était officiellement une ennemie de l’État.", "Mais elle refusait de fuir.", "– « La vérité ne se cache pas, » disait-elle à Donna, quelques jours plus tôt.", "« Et je ne recule pas devant un mensonge. »", "Ce qu’elle ne savait pas… c’est qu’ils étaient déjà là.", "Commandant AXE – transmission chuchotée :", "– « Objectif localisé. Protocole Prométhée, phase 3. Aucun contact verbal. »", "Ils encerclèrent son campement silencieusement. Aucun tir, aucun cri. Juste des ondes électro-graviton, projetées en cônes inversés. Des filets de lumière comprimée.", "Le premier signal frappa.", "Diana bondit.", "Trop tard.", "Un souffle invisible la cloua au sol. Non par violence… mais par poids. Chaque cellule de son corps semblait alourdie, figée. Sa volonté, intacte, criait de se relever, mais son corps ne répondait plus.", "Des champs de contrainte absolue… conçus pour elle seule.", "Elle vit leurs visages masqués. Aucun regard. Aucune haine. Seulement l’efficacité froide d’un protocole bien huilé.", "Diana (murmure) :", "– « L’ordre sans justice… n’est qu’un autre nom pour la peur. »", "Le commandant s’approcha. Sortit une capsule noire, de la taille d’un poing.", "Il la posa contre le cou de Diana.", "Injection silencieuse. Neural freeze.", "Système volontaire verrouillé.", "Ses yeux restèrent ouverts. Mais la lutte intérieure venait d’être… figée.", "Ils l’emportèrent sans bruit."]}, {"title": "L’analyse psychologique", "place": "Complexe de l’Ordre – Salle blanche 01", "time": "16h34", "paragraphs": ["16h34. Aucune horloge. Aucune ombre. Rien que le silence.", "Elle ouvrit les yeux.", "La pièce était blanche. Non pas simplement peinte : faite de blanc. Un cube parfait, sans porte visible. Assise au centre, sur un siège de marbre.", "Elle n’était pas attachée.", "Et pourtant… elle ne bougeait pas.", "Une seule autre présence dans la pièce. Immobile. À quelques pas.", "Lui.", "Le Sovereign.", "Il était assis, jambes croisées, un carnet sur les genoux. Pas d’arme. Pas de garde.", "Juste lui, et sa voix.", "– « Tu es revenue parmi nous. Bonjour, Diana. »", "Elle ne répondit pas.", "Il esquissa un demi-sourire.", "« Pas de chaînes. Pas de violence. Tu remarques ?", "C’est important, pour moi.", "Parce que ce n’est pas toi que je veux briser.", "C’est l’erreur que tu représentes. »", "Silence. Il tourne une page de son carnet.", "« Tu veux protéger.", "Mais tu désobéis aux lois.", "Tu parles de paix.", "Mais tu agis sans mandat.", "Tu refuses l’autorité.", "Mais tu prétends représenter la justice.", "Dis-moi…", "Qu’est-ce qui fait de toi une héroïne ?", "Et non une menace incontrôlable ? »", "Elle parle enfin. Sa voix est sèche, ferme.", "– « Mon serment. Mon peuple. Mon honneur. »", "Il penche la tête.", "– « Ton peuple… ce sont des immortelles séparatistes.", "Ton serment, une tradition étrangère.", "Ton honneur… une abstraction.", "Ce que tu appelles fidélité, moi, je l’appelle loyauté mal placée. »", "Il se lève.", "« Tu n’es pas mon ennemie, Diana. Tu es mon plus grand espoir. »", "Elle le fixe. Son regard se durcit.", "– « Vous voulez me retourner contre les miens.", "Cela n’arrivera pas. »", "Il s’arrête. Pose son carnet sur la table.", "– « Non.", "Je veux que tu ouvres les yeux.", "Et que tu comprennes que tu es déjà contre les tiens… depuis toujours.", "Tu as quitté Themyscira.", "Tu as vécu avec les hommes.", "Tu es intervenue dans leurs conflits.", "Tu as imposé ta justice au monde entier… seule.", "N’est-ce pas toi, la traîtresse originelle ? »", "Un silence plus lourd que les murs blancs.", "Elle ferme les yeux.", "Et il conclut :", "« Ce n’est pas moi qui ai trahi les amazones, Diana.", "C’est toi.", "Et je vais t’aider à réparer cette faute. »", "Il sort alors une boîte noire. Il l’ouvre lentement.", "À l’intérieur : un lasso, noir comme la nuit, tressé d’ombres mouvantes.", "Il s’approch      startAt=Date.now();active=true;
   };
   const touchEnd=e=>{
     if(!active||!e.changedTouches.length)return;
     active=false;
     const dx=e.changedTouches[0].clientX-startX;
     const dy=e.changedTouches[0].clientY-startY;
     if(dx>65 && Math.abs(dx)>Math.abs(dy)*1.5 && index>0){
       // Only intervene when the native engine hasn't started turning.
       const state=flip.getState?.();
       if(state==='read')flip.flipPrev('bottom');
     }
   };
   book.addEventListener('touchstart',touchStart,{passive:true});
   book.addEventListener('touchend',touchEnd,{passive:true});
 }
 flip.on('flip',event=>{
   index=event.data;
   // render() is only used to update status, navigation and saved position.
   const p=pages[index];$('status').textContent=`Page ${index+1} sur ${pages.length}`;
   $('prev').disabled=index===0;$('next').disabled=index===pages.length-1;
   safeStore.setItem(saveKey,JSON.stringify({type:p.type,scene:p.scene,part:p.part}));
 });
 $('status').textContent=`Page ${index+1} sur ${pages.length}`;
 $('prev').disabled=index===0;$('next').disabled=index===pages.length-1;
}
function go(delta){if(!flip)return;if(delta>0)flip.flipNext();else flip.flipPrev()}
function jumpScene(i){const n=pages.findIndex(p=>p.type==='text'&&p.scene===i);if(n>=0&&flip)flip.turnToPage(n)}
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('tocBtn').onclick=()=>{if(flip)flip.turnToPage(2)};
$('settingsBtn').onclick=()=>$('modal').classList.add('open');
$('close').onclick=()=>$('modal').classList.remove('open');
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
$('size').oninput=e=>{font=+e.target.value;$('sizeValue').textContent=font+' px';document.documentElement.style.setProperty('--font',font+'px');safeStore.setItem(fontKey,font);paginate()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
// Delegation survives library DOM changes.
$('book').addEventListener('click',e=>{const btn=e.target.closest('[data-scene]');if(btn)jumpScene(+btn.dataset.scene)});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{
 if(flip){try{flip.destroy()}catch(e){}flip=null}
 $('book').innerHTML='<div class="sheet" id="sheet"><div class="page" id="page"></div></div>';
 paginate();
},350)});
paginate();
</script></body></html>
